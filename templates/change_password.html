{% extends 'base.html' %}{% block title %}Change password · His Grace Academy{% endblock %}{% block page_heading %}Change password{% endblock %}{% block content %}<form method="post" class="panel form-panel narrow"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="form-section"><h3>Update your sign-in password</h3><p class="muted">Use at least 12 characters, with an uppercase letter and a number.</p><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></label></div><div class="form-actions"><a class="btn ghost" href="{{ home_url() }}">Cancel</a><button class="btn primary">Change password</button></div></form>{% endblock %}
