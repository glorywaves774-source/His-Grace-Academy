{% extends 'base.html' %}{% block title %}Create fee invoice · His Grace Academy{% endblock %}{% block page_heading %}Create fee invoice{% endblock %}{% block content %}
<form method="post" class="panel form-panel narrow"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="form-section"><h3>Invoice details</h3><div class="form-grid"><label class="span-2">Student *<select name="student_id" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.id }}">{{ s.admission_no }} · {{ s.first_name }} {{ s.last_name }}</option>{% endfor %}</select></label><label>Academic year *<input name="academic_year" placeholder="2026/2027" required></label><label>Term *<select name="term" required><option value="">Select term</option><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></label><label class="span-2">Description *<input name="description" maxlength="200" placeholder="Tuition, books, transport" required></label><label>Amount (GHS) *<input name="amount" type="number" min="0" step="0.01" required></label><label>Discount (GHS)<input name="discount" type="number" min="0" step="0.01" value="0"></label><label>Due date *<input name="due_date" type="date" value="{{ today }}" required></label></div></div><div class="form-actions"><a class="btn ghost" href="{{ url_for('invoices') }}">Cancel</a><button class="btn primary">Create invoice</button></div></form>{% endblock %}
